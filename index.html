header h1{font-family:'Chewy',system-ui,sans-serif;font-size:26px;margin:0;font-weight:400;letter-spacing:1.5px;color:#f6a85c;line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.12)}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;font-size:14px}
nav button.on{background:#fff;color:var(--g);font-weight:600}
#st{margin-left:auto;font-size:12px;opacity:.9}
main{max-width:1150px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:12px 0 6px;color:var(--mu);text-transform:uppercase;letter-spacing:.03em}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;min-width:0}
textarea{width:100%;min-height:60px}
button.b{background:var(--g);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
button.s{background:#fff;color:var(--g);border:1px solid var(--g);border-radius:8px;padding:7px 11px;font:inherit;cursor:pointer}
button.x{background:#fff;color:#b71c1c;border:1px solid #e0a0a0;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mu);font-weight:600;position:sticky;top:0;background:#fff}td.n,th.n{text-align:right;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;font-weight:600}
.tA{background:var(--A)}.tB{background:var(--B)}.tC{background:var(--C)}.tD{background:var(--D)}.tS{background:#eceff1}
.warn{background:#fff3e0;border:1px solid #ffcc80;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
.err{background:#ffebee;border:1px solid #ef9a9a}.ok{background:var(--g2);border:1px solid #a5d6a7}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.kpi{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:20px;margin-top:4px}.kpi span{color:var(--mu);font-size:12px}
.mu{color:var(--mu);font-size:13px}.scroll{max-height:60vh;overflow:auto}
.sug{position:absolute;background:#fff;border:1px solid var(--bd);border-radius:8px;max-height:260px;overflow:auto;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.12);min-width:260px}
.sug div{padding:8px 10px;cursor:pointer;border-bottom:1px solid #f0f0f0}.sug div:hover,.sug div.act{background:var(--g2)}
.rel{position:relative}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.dlg .card{max-width:620px;width:100%;max-height:90vh;overflow:auto}
pre.wa{white-space:pre-wrap;background:#f1f8e9;border-radius:8px;padding:10px;font-size:13px}
.qty{width:76px}.pr{width:110px}
@media(max-width:640px){th.hm,td.hm{display:none}main{padding:8px}}
</style>

<script>

const S={view:(location.hash||'#pedido').slice(1),clientes:[],productos:[],pedidos:[],pagos:[],bajas:[],reposiciones:[],vendedores:[],movVend:[],camiones:[],cierres:[],gastos:[],gastosFijos:[],proveedores:[],cotizaciones:[],usuarios:[],solicitudes:[],raw:{},yo:null,yoOwner:false,config:null,db:null,dl:null,can:true,draft:{cli:null,items:[],cond:'CC',lista:'may',nota:''},f:{q:'',cat:'',tipo:'',est:'',desde:''}};

function infoCont(p){const pag=S.pagos.filter(g=>g.pedidoId===p.id).reduce((s,g)=>s+g.monto,0);const nc=S.bajas.filter(b=>b.pedidoId===p.id&&b.acreditar).reduce((s,b)=>s+(b.monto||0),0);const saldo=p.estado==='anulado'?-(pag+nc):p.total-pag-nc;

function saldos(){const m={};const get=id=>m[id]||(m[id]={deuda:0,pag:0,abiertos:[],porPed:{},libre:0,detalle:[]});

 const ccVivo=pid=>{const p=pid&&S.pedidos.find(x=>x.id===pid);return !!(p&&p.cond==='CC'&&p.estado!=='anulado')};
 for(const p of S.pedidos){if(p.estado==='anulado'||p.cond!=='CC')continue;get(p.clienteId).deuda+=p.total}
 const imputar=(cid,pid,mto)=>{const s=get(cid);s.pag+=mto;if(ccVivo(pid))s.porPed[pid]=(s.porPed[pid]||0)+mto;else s.libre+=mto};
 for(const g of S.pagos){if(isCont(g.pedidoId))continue;imputar(g.clienteId,g.pedidoId,g.monto)}
 for(const b of S.bajas){if(!b.acreditar||!b.clienteId||!b.monto||isCont(b.pedidoId))continue;imputar(b.clienteId,b.pedidoId,b.monto)}
 for(const id in m){const s=m[id];s.saldo=s.deuda-s.pag;const peds=S.pedidos.filter(p=>p.clienteId===id&&p.cond==='CC'&&p.estado!=='anulado').sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.numero-b.numero);
  let rest=s.libre;const ap={};for(const p of peds){const d=s.porPed[p.id]||0;const t=Math.min(d,p.total);ap[p.id]=t;rest+=d-t}

   s.detalle.push({p,pagado:ap[p.id],resta,est:resta<=1?'Pagada':ap[p.id]>1?'Pago parcial':'Impaga'});if(resta>1)s.abiertos.push({p,resta,pagado:ap[p.id]})}
  s.antig=s.abiertos.length?daysBetween(s.abiertos[0].p.fecha,today()):0}
 return m}

 ({pedido:vPedido,pedidos:vPedidos,bajas:vBajas,stock:vStock,gastos:vGastos,proveedores:vProveedores,contado:vContado,vendedores:vVendedores,clientes:vClientes,cc:vCC,productos:vProductos,resumen:vResumen}[v]||vPedido)(a)}

 <div class="row"><div class="rel grow"><input id="cq" class="grow" style="width:100%" placeholder="Buscar cliente (nombre o teléfono)…" value="${c?esc(c.nombre):''}" autocomplete="off"><div id="csug"></div></div>

 const show=()=>{list=src(I.value);act=0;B.innerHTML=list.length?`<div class="sug">${list.map((x,i)=>`<div data-i="${i}" class="${i===act?'act':''}">${x.html}</div>`).join('')}</div>`:'';

 I.oninput=show;I.onfocus=()=>{if(inp==='#cq')I.select();show()};I.onblur=()=>setTimeout(()=>B.innerHTML='',150);
 I.onkeydown=e=>{if(e.key==='ArrowDown'){act=Math.min(act+1,list.length-1);hl()}else if(e.key==='ArrowUp'){act=Math.max(act-1,0);hl()}else if(e.key==='Enter'&&list[act]){e.preventDefault();B.innerHTML='';pick(list[act].id)}};
 const hl=()=>B.querySelectorAll('[data-i]').forEach((el,i)=>el.classList.toggle('act',i===act));}

function simPago(cid,m,pid){const s=saldos()[cid];const ab=s?s.abiertos.map(x=>({...x})):[];const out=[];let r=m;
 const orden=pid?[...ab.filter(x=>x.p.id===pid),...ab.filter(x=>x.p.id!==pid)]:ab;
 for(const x of orden){if(r<=0.5)break;const t=Math.min(r,x.resta);r-=t;out.push({x,t,queda:x.resta-t})}
 return{out,sobra:r,saldoDesp:(s?s.saldo:0)-m}}

async function guardarPago(){const cid=$('#g_c').value,m=parseFloat($('#g_m').value);if(!cid)return msg('Elegí el cliente',true);if(!(m>0))return msg('Ingresá un monto',true);const c=S.clientes.find(x=>x.id===cid);

 try{if(p){const t=sim.out.length&&sim.out[0].x.p.id===pid?sim.out[0].t:m;
   await S.db.collection('pagos').add({clienteId:cid,clienteNombre:c.nombre,pedidoId:pid,numero:p.numero,monto:t,medio,fecha:fe,nota,creado:new Date().toISOString()});

  else await S.db.collection('pagos').add({clienteId:cid,clienteNombre:c.nombre,monto:m,medio,fecha:fe,nota,creado:new Date().toISOString()});
  recibo(c,m,medio,fe,sim.out.map(o=>({numero:o.x.p.numero,t:o.t,queda:o.queda})),sim.saldoDesp)}catch(e){msg('No se pudo guardar',true)}}

const CAT_FIJ=['Alquiler','Sueldos','Cargas sociales','Luz','Agua','Gas','Internet y teléfono','Seguro','Impuestos y tasas','Contador','Cuota de vehículo','Otros fijos'];

const FREC={Mensual:1,Quincenal:2,Semanal:4.33,Anual:1/12};
const mesAct=()=>today().slice(0,7);
function resMes(m){const en=x=>(x.fecha||'').slice(0,7)===m;const ps=S.pedidos.filter(p=>p.estado!=='anulado'&&en(p));
 const ventas=ps.reduce((s,p)=>s+p.total,0),costo=ps.reduce((s,p)=>s+p.items.reduce((t,i)=>t+i.cant*(i.costo||0),0),0);
 const nc=S.bajas.filter(b=>b.acreditar&&en(b)).reduce((s,b)=>s+(b.monto||0),0),merma=S.bajas.filter(b=>b.tipo==='merma'&&en(b)).reduce((s,b)=>s+(b.costoPerdido||0),0);
 const gs=S.gastos.filter(en),fij=gs.filter(g=>g.tipo==='Fijo').reduce((s,g)=>s+g.monto,0),vari=gs.filter(g=>g.tipo==='Variable').reduce((s,g)=>s+g.monto,0);
 const flete=S.camiones.filter(en).reduce((s,c)=>s+(c.gastos||0),0);const bruta=ventas-nc-costo-merma;
 return{ventas,costo,nc,merma,bruta,fij,vari,flete,gastos:fij+vari+flete,neta:bruta-fij-vari-flete,gs}}
function vGastos(a){const m=S.f.gmes||mesAct();const r=resMes(m);const fijos=S.gastosFijos.filter(f=>f.activo!==false).sort((x,y)=>(x.dia||0)-(y.dia||0));
 const pagoDe=f=>r.gs.filter(g=>g.fijoId===f.id);const presup=fijos.reduce((s,f)=>s+f.monto*(FREC[f.frecuencia]||1),0);
 const porCat={};for(const g of r.gs)porCat[g.tipo+'|'+g.categoria]=(porCat[g.tipo+'|'+g.categoria]||0)+g.monto;if(r.flete)porCat['Variable|Flete de camiones (automático)']=r.flete;
 a.innerHTML=`<div class="row" style="margin-bottom:10px"><label>Mes <input type="month" id="gm" value="${m}"></label><button class="b" onclick="gasto('Variable')">+ Gasto variable</button><button class="b" onclick="gasto('Fijo')">+ Pago de gasto fijo</button><button class="s" onclick="exportar('gastos')">Exportar CSV</button></div>
 <div class="kpis"><div class="kpi"><span>Ganancia bruta del mes</span><b>${money(r.bruta)}</b><span>ventas ${money(r.ventas)} − mercadería ${money(r.costo)}${r.merma?' − mermas '+money(r.merma):''}${r.nc?' − devoluciones '+money(r.nc):''}</span></div>
 <div class="kpi"><span>Gastos fijos</span><b>${money(r.fij)}</b><span>previstos ${money(presup)}</span></div><div class="kpi"><span>Gastos variables</span><b>${money(r.vari+r.flete)}</b>${r.flete?`<span>incluye fletes de camiones ${money(r.flete)}</span>`:''}</div>
 <div class="kpi"><span>Ganancia neta del mes</span><b style="color:${r.neta<0?'#b00':'var(--g)'}">${money(r.neta)}</b><span>${r.ventas?Math.round(r.neta/r.ventas*100)+'% de las ventas':''}</span></div></div>
 <div class="card" style="margin-top:12px"><h2>Gastos fijos</h2><div class="row"><button class="s" onclick="gastoFijo()">+ Agregar gasto fijo</button><span class="mu">Cargalos una vez (alquiler, sueldos, luz…) y cada mes marcás el pago.</span></div>
 <table style="margin-top:8px"><tr><th>Gasto</th><th>Categoría</th><th class="n">Monto</th><th>Frecuencia</th><th class="n">Vence día</th><th>Este mes</th><th></th></tr>
 ${fijos.map(f=>{const p=pagoDe(f),pag=p.reduce((s,g)=>s+g.monto,0),deb=f.monto*(FREC[f.frecuencia]||1);const dia=parseInt(f.dia)||0;const venc=m===mesAct()&&dia&&pag<deb-1&&parseInt(today().slice(8))>dia;
  return `<tr style="${venc?'background:#fff5f5':''}"><td>${esc(f.nombre)}</td><td>${esc(f.categoria)}</td><td class="n">${money(f.monto)}</td><td>${esc(f.frecuencia)}</td><td class="n">${dia||'—'}</td><td>${pag>=deb-1?`<span class="tag tA">Pagado ${money(pag)}</span>`:pag>0?`<span class="tag tB">Pagado ${money(pag)} de ${money(deb)}</span>`:`<span class="tag ${venc?'tD':'tS'}">${venc?'Vencido':'Pendiente'}</span>`}</td>
  <td class="row">${pag<deb-1?`<button class="b" onclick="gasto('Fijo','${f.id}')">Pagar</button>`:''}<button class="s" onclick="gastoFijo('${f.id}')">Editar</button></td></tr>`}).join('')||'<tr><td colspan="7" class="mu">Todavía no cargaste gastos fijos.</td></tr>'}</table></div>
 <div class="card"><h2>Por categoría</h2><table>${Object.entries(porCat).sort((x,y)=>y[1]-x[1]).map(([k,v])=>{const [t,c]=k.split('|');const tot=r.gastos||1;return `<tr><td>${esc(c)}</td><td class="mu">${t}</td><td class="n">${money(v)}</td><td style="width:40%"><div style="height:8px;border-radius:4px;background:${t==='Fijo'?'#2e7d32':'#f08a3c'};width:${Math.round(v/tot*100)}%"></div></td><td class="n mu">${Math.round(v/tot*100)}%</td></tr>`}).join('')||'<tr><td class="mu">Sin gastos este mes.</td></tr>'}</table></div>

 const mejor={},gana={};for(const p of prods){const cs=provs.map(v=>U[p.id+'|'+v.id]).filter(Boolean);if(!cs.length)continue;const min=Math.min(...cs.map(c=>c.precio));const bp=cs.find(c=>c.precio===min);

 try{if(all){for(const g of r.pagos)await S.db.doc('pagos/'+g.id).delete();for(const b of r.bajas)await S.db.doc('bajas/'+b.id).delete();for(const x of r.repos)await S.db.doc('reposiciones/'+x.id).delete();for(const p of r.peds)await S.db.doc('pedidos/'+p.id).delete()}

function difItems(a,b){const k=i=>i.prodId+'|'+(i.lista||'may');const A=Object.fromEntries((a||[]).map(i=>[k(i),i])),B=Object.fromEntries((b||[]).map(i=>[k(i),i]));const out=[];
 for(const [x,i] of Object.entries(B)){const o=A[x];if(!o)out.push('+ '+i.cant+' '+i.nombre);else if(o.cant!==i.cant)out.push(i.nombre+': '+o.cant+' → '+i.cant);else if(o.precio!==i.precio)out.push(i.nombre+': precio '+money(o.precio)+' → '+money(i.precio))}
 for(const [x,o] of Object.entries(A))if(!B[x])out.push('− '+o.cant+' '+o.nombre+' (quitado)');return out}

 if(uc)for(const l of uc.lineas)if(l.contado)g(l.prodId);

async function guardarLiq(){const d=$('#lq_d').value||today(),h=$('#lq_h').value||today();if(h<d)return msg('La fecha "hasta" es anterior a "desde"',true);let n=0;
 try{for(let k=0;k<S.liqL.length;k++){if(!$('#lq_c'+k).checked)continue;const l=S.liqL[k],pct=parseFloat($('#lq_p'+k).value)||0;if(pct<=0)continue;const o=liqPrecio(l.p,pct);

  msg(n+' producto(s) en oferta');mensajeOferta(true)}catch(e){msg('No se pudo guardar: '+(e.message||e.code),true)}}
function textoOferta(){const c=cfg();const ofs=S.productos.filter(p=>p.oferta&&p.oferta.hasta>=today()).sort((a,b)=>b.oferta.pct-a.oferta.pct||(a.nombre<b.nombre?-1:1));if(!ofs.length)return'';const h=ofs[0].oferta.hasta;
 return `*${c.negocio}* 🔥 *OFERTAS DEL DÍA*\n`+ofs.map(p=>`• ${p.nombre}: *${money(p.oferta.may)}* el bulto (antes ${money(p.oferta.antesMay||p.precioMay)}, -${p.oferta.pct}%)`).join('\n')+`\n\nVálido hasta el ${h.split('-').reverse().join('/')} o hasta agotar stock.\nRespondé este mensaje con tu pedido 🙌`}

 const act=new Set(S.pedidos.filter(p=>p.fecha>=new Date(Date.now()-60*864e5).toISOString().slice(0,10)).map(p=>p.clienteId));
 let cs=S.clientes.filter(c=>String(c.telefono||'').replace(/\D/g,'').length>=8);if(f==='act')cs=cs.filter(c=>act.has(c.id));else if(f==='cont')cs=cs.filter(c=>c.tipo!=='CUENTA CORRIENTE');else if(f==='ab')cs=cs.filter(c=>/^[AB]/.test(c.categoria||''));
 cs.sort((a,b)=>a.nombre<b.nombre?-1:1);const env=cs.filter(c=>S.envOf[c.id]).length;

async function guardarDevolucion(pid){const p=S.pedidos.find(x=>x.id===pid);const items=p.items.map((i,k)=>({prodId:i.prodId,nombre:i.nombre,unidad:i.lista==='min'?'kg/un':'bulto',cant:Math.min(parseFloat($('#dv_'+k).value)||0,i.cant),precio:i.precio,costo:i.costo||0})).filter(i=>i.cant>0);
 if(!items.length)return msg('Indicá al menos una cantidad',true);

function precioLista(prodId,lista){const x=S.productos.find(p=>p.id===prodId)||{};return lista==='min'?(x.precioMin||x.precioMay||0):(x.precioMay||0)}
function reposicion(pid){const p=S.pedidos.find(x=>x.id===pid);const opts=sel=>S.productos.slice().sort((a,b)=>a.nombre<b.nombre?-1:1).map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.nombre)}</option>`).join('');
 dlg(`<h2>Reposición – Pedido N° ${p.numero}</h2><div class="mu">${esc(p.clienteNombre)} · Lo que devuelve vuelve al stock (no es baja) y sale otro producto en reemplazo.</div>

 <label class="row" style="gap:6px;margin-top:6px"><input type="checkbox" id="rp_aj" checked onchange="repPrev('${pid}')"> Actualizar el pedido con la diferencia de precio (nuevo total)</label>

function repLeer(p){const items=[];p.items.forEach((i,k)=>{const c=Math.min(parseFloat($('#rp_c'+k).value)||0,i.cant),q=parseFloat($('#rp_q'+k).value)||0;if(c<=0&&q<=0)return;const rp=S.productos.find(x=>x.id===$('#rp_p'+k).value)||{};
 items.push({k,retProdId:i.prodId,retNombre:i.nombre,cant:c,retPrecio:i.precio,repProdId:rp.id||i.prodId,repNombre:rp.nombre||i.nombre,repCant:q,repPrecio:parseFloat($('#rp_pr'+k).value)||0,lista:i.lista||'may',unidad:i.unidad,repCosto:rp.costo||0})});return items}
function repNuevoPedido(p,items){let its=p.items.map(x=>({...x}));for(const r of items){const o=its[r.k];o.cant=Math.round((o.cant-r.cant)*100)/100}
 for(const r of items){if(r.repCant<=0)continue;const e=its.find(x=>x.prodId===r.repProdId&&x.precio===r.repPrecio&&(x.lista||'may')===r.lista);if(e)e.cant=Math.round((e.cant+r.repCant)*100)/100;
  else its.push({prodId:r.repProdId,nombre:r.repNombre,cant:r.repCant,precio:r.repPrecio,lista:r.lista,unidad:r.unidad,costo:r.repCosto})}
 its=its.filter(x=>x.cant>0);return{its,tot:total(its)}}

 let txt=Math.abs(dif)<1?'Sin diferencia de precio.':dif>0?`El reemplazo cuesta <b>${money(dif)}</b> más: el cliente paga la diferencia.`:`El reemplazo cuesta <b>${money(-dif)}</b> menos: se le descuenta al cliente.`;

async function guardarReposicion(pid){const p=S.pedidos.find(x=>x.id===pid);const items=repLeer(p);
 if(!items.length)return msg('Indicá al menos una cantidad',true);

function vBajas(a){const f=S.f;const desde=f.bdesde||new Date(Date.now()-30*864e5).toISOString().slice(0,10);

async function guardarVend(id){const n=$('#v_n').value.trim();if(!n)return msg('Falta el nombre',true);

 try{if(id)await S.db.doc('vendedores/'+id).update(d);else{let nid='V-'+slug(n);if(S.vendedores.some(x=>x.id===nid))nid+='-'+Date.now().toString(36);await S.db.doc('vendedores/'+nid).set(d)}closeDlg();msg('Vendedor guardado')}catch(e){msg('No se pudo guardar',true)}}
function periodoSug(v){const d=new Date(),fmt=x=>x.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});
 if(v.modalidad==='Quincenal'){const y=d.getFullYear(),m=d.getMonth();return d.getDate()<=15?`1ª quincena ${String(m+1).padStart(2,'0')}/${y}`:`2ª quincena ${String(m+1).padStart(2,'0')}/${y}`}
 const day=(d.getDay()+6)%7,ini=new Date(d-day*864e5),fin=new Date(+ini+6*864e5);return `Semana ${fmt(ini)} al ${fmt(fin)}`}
function pagoSueldo(id){const v=S.vendedores.find(x=>x.id===id);const pend=pendVend(id);const pt=pend.reduce((s,m)=>s+m.monto,0);
 dlg(`<h2>Pagar sueldo – ${esc(v.nombre)}</h2><div class="row"><label>Fecha<br><input type="date" id="ps_f" value="${today()}"></label><label class="grow">Período<br><input id="ps_p" style="width:100%" value="${esc(periodoSug(v))}"></label></div>
 <div class="row" style="margin-top:6px"><label>Sueldo ${esc((v.modalidad||'Semanal').toLowerCase())} $<br><input id="ps_b" type="number" step="1000" value="${v.sueldo||0}" oninput="psCalc()"></label><label>Extras / comisión $<br><input id="ps_x" type="number" step="1000" value="0" oninput="psCalc()"></label><label>Medio<br><select id="ps_me"><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option></select></label></div>

 <div class="warn ok" style="margin-top:10px;font-size:16px">Neto a pagar: <b id="ps_n"></b></div>

 <div class="row" style="margin-top:10px"><button class="b" onclick="guardarSueldo('${id}')" ${S.can?'':'disabled'}>Registrar pago</button><button class="s" onclick="closeDlg()">Cancelar</button></div>`);psCalc()}
function psCalc(){const b=(parseFloat($('#ps_b').value)||0)+(parseFloat($('#ps_x').value)||0);let d=0;document.querySelectorAll('.ps_d').forEach(x=>{if(x.checked)d+=parseFloat(x.dataset.m)||0});$('#ps_n').textContent=money(b-d)+(d?` (bruto ${money(b)} − descuentos ${money(d)})`:'')}
async function guardarSueldo(id){const v=S.vendedores.find(x=>x.id===id);const bruto=(parseFloat($('#ps_b').value)||0)+(parseFloat($('#ps_x').value)||0);const ids=[];let d=0;
 document.querySelectorAll('.ps_d').forEach(x=>{if(x.checked){ids.push(x.dataset.id);d+=parseFloat(x.dataset.m)||0}});
 const doc={vendedorId:id,vendedorNombre:v.nombre,fecha:$('#ps_f').value||today(),tipo:'Sueldo',periodo:$('#ps_p').value,monto:bruto,base:parseFloat($('#ps_b').value)||0,extras:parseFloat($('#ps_x').value)||0,descuentos:d,neto:bruto-d,medio:$('#ps_me').value,descontados:ids,nota:$('#ps_no').value,creado:new Date().toISOString()};
 try{const r=await S.db.collection('movVendedores').add(doc);for(const mid of ids)await S.db.doc('movVendedores/'+mid).update({liquidadoEn:r.id});closeDlg();msg('Sueldo registrado · neto '+money(doc.neto))}catch(e){msg('No se pudo guardar: '+(e.message||e.code),true)}}

 dlg(`<h2>${merc?'Mercadería que se lleva':'Adelanto'} – ${esc(v.nombre)}</h2><div class="row"><label>Fecha<br><input type="date" id="mv_f" value="${today()}"></label>${merc?'':`<label>Monto $<br><input id="mv_m" type="number" step="1000"></label><label>Medio<br><select id="mv_me"><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option></select></label>`}</div>
 ${merc?`<div class="row" style="margin-top:8px"><div class="rel grow"><input id="mv_q" style="width:100%" placeholder="Agregar producto…" autocomplete="off"><div id="mv_s"></div></div><label>Valor a<br><select id="mv_pr" onchange="mvRender()"><option value="costo">Costo</option><option value="may">Precio mayorista</option><option value="min">Precio minorista (kg/un)</option></select></label></div><div id="mv_t"></div>`:''}

 if(merc){mvRender();picker('#mv_q','#mv_s',q=>S.productos.filter(x=>match(x.nombre,q)).slice(0,10).map(x=>({id:x.id,html:esc(x.nombre)})),pid=>{S.mvItems.push({prodId:pid,cant:1,precio:null});$('#mv_q').value='';mvRender()})}}
function mvPrecio(p){const t=$('#mv_pr')?$('#mv_pr').value:'costo';return Math.round(t==='may'?p.precioMay:t==='min'?p.precioMin:p.costo)||0}
function mvRender(){const t=$('#mv_t');if(!t)return;t.innerHTML=S.mvItems.length?`<table style="margin-top:8px"><tr><th>Producto</th><th class="n">Cant.</th><th class="n">Precio</th><th class="n">Subtotal</th><th></th></tr>${S.mvItems.map((i,k)=>{const p=S.productos.find(x=>x.id===i.prodId)||{};const pr=i.precio??mvPrecio(p);return `<tr><td>${esc(p.nombre)}</td><td class="n"><input class="qty" type="number" step="0.5" value="${i.cant}" onchange="S.mvItems[${k}].cant=parseFloat(this.value)||0;mvRender()"></td><td class="n"><input class="pr" type="number" step="100" value="${pr}" onchange="S.mvItems[${k}].precio=parseFloat(this.value)||0;mvRender()"></td><td class="n">${money(i.cant*pr)}</td><td><button class="x" onclick="S.mvItems.splice(${k},1);mvRender()">✕</button></td></tr>`}).join('')}<tr><th colspan="3" class="n">TOTAL</th><th class="n">${money(S.mvItems.reduce((s,i)=>{const p=S.productos.find(x=>x.id===i.prodId)||{};return s+i.cant*(i.precio??mvPrecio(p))},0))}</th><th></th></tr></table><div class="mu">Se descuenta del stock al registrar.</div>`:'<div class="mu" style="margin-top:6px">Agregá los productos que se lleva.</div>'}
async function guardarMovVend(id,tipo){const v=S.vendedores.find(x=>x.id===id);let monto,items=null;
 if(tipo==='Mercadería'){items=S.mvItems.filter(i=>i.cant>0).map(i=>{const p=S.productos.find(x=>x.id===i.prodId)||{};return{prodId:i.prodId,nombre:p.nombre,cant:i.cant,precio:i.precio??mvPrecio(p)}});if(!items.length)return msg('Agregá al menos un producto',true);monto=items.reduce((s,i)=>s+i.cant*i.precio,0)}
 else{monto=parseFloat($('#mv_m').value)||0;if(monto<=0)return msg('Ingresá el monto',true)}
 const doc={vendedorId:id,vendedorNombre:v.nombre,fecha:$('#mv_f').value||today(),tipo,monto,descontar:$('#mv_d').checked,nota:$('#mv_no').value,creado:new Date().toISOString()};
 if(items)doc.items=items;else doc.medio=$('#mv_me').value;
 try{await S.db.collection('movVendedores').add(doc);if(items)for(const i of items)await ajustarStock(i.prodId,-i.cant);closeDlg();msg(tipo+' registrado')}catch(e){msg('No se pudo guardar',true)}}
function detVend(id){const v=S.vendedores.find(x=>x.id===id);const mv=S.movVend.filter(m=>m.vendedorId===id).sort((a,b)=>a.fecha<b.fecha?1:-1);
 dlg(`<h2>Movimientos – ${esc(v.nombre)}</h2><div class="scroll"><table><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th class="n">Monto</th><th>Estado</th></tr>${mv.map(m=>`<tr><td>${m.fecha}</td><td>${m.tipo}</td><td>${m.tipo==='Sueldo'?esc(m.periodo||'')+(m.descuentos?` · bruto ${money(m.monto)} − desc. ${money(m.descuentos)}`:''):esc((m.items||[]).map(i=>i.cant+' '+i.nombre).join(', '))}${m.nota?`<div class="mu">${esc(m.nota)}</div>`:''}</td><td class="n">${money(m.tipo==='Sueldo'?m.neto:m.monto)}</td><td>${m.tipo==='Sueldo'?'Pagado':m.descontar?(m.liquidadoEn?'Descontado':'A descontar'):'No se descuenta'}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">Sin movimientos.</td></tr>'}</table></div><div class="row" style="margin-top:10px"><button class="s" onclick="closeDlg()">Cerrar</button></div>`)}

async function importarRespaldo(){const f=$('#resp').files[0];const st=$('#impst');if(!f)return st.textContent='Elegí el archivo primero.';$('#imp').disabled=true;
 try{const j=JSON.parse(await f.text());const all=[];for(const [col,arr] of Object.entries(j.datos||{}))for(const x of arr){const {id,...d}=x;if(id)all.push([col+'/'+id,d])}
  let i=0;const worker=async()=>{while(i<all.length){const [p,d]=all[i++];for(let t=0;t<3;t++){try{await S.db.doc(p).set(d);break}catch(e){if(t===2)throw e;await new Promise(r=>setTimeout(r,800*(t+1)))}}st.textContent=`Cargando… ${i}/${all.length}`}};
  await Promise.all([worker(),worker(),worker(),worker()]);const c={...(j.config||{})};await S.db.doc('config/main').set({...cfg(),...c,importado:true});st.textContent='¡Listo!';render()}
 catch(e){$('#imp').disabled=false;st.textContent='Error: '+(e.message||e.code)}}
async function importar(){const b=$('#imp');b.disabled=true;const st=$('#impst');
 try{const r=await fetch('seed.json');const j=await r.json();const all=[...Object.entries(j.productos).map(([id,d])=>['productos/'+id,d]),...Object.entries(j.clientes).map(([id,d])=>['clientes/'+id,d])];
  let i=0;const worker=async()=>{while(i<all.length){const [p,d]=all[i++];for(let t=0;t<3;t++){try{await S.db.doc(p).set(d);break}catch(e){if(e.code==='quota_exceeded'||e.code==='invalid_argument')throw e;await new Promise(r=>setTimeout(r,800*(t+1)))}}st.textContent=`Cargando… ${i}/${all.length}`}};
  await Promise.all([worker(),worker(),worker(),worker()]);await S.db.doc('config/main').set({...cfg(),importado:true});st.textContent='¡Listo!';render()}
 catch(e){b.disabled=false;st.textContent='Error: '+(e.message||e.code)+'. Probá de nuevo.'}}

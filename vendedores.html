<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laranjeira · Vendedores</title><meta name="theme-color" content="#2e7d32"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Vendedores">
<style>
@font-face{font-family:'Chewy';src:url(chewy.woff2) format('woff2');font-display:swap}
:root{--g:#2e7d32;--o:#f6a85c;--bg:#f6f7f5;--tx:#1d2420;--mu:#6b7570;--bd:#dfe3df}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
header{background:var(--g);color:#fff;padding:10px 14px 0;position:sticky;top:0;z-index:5;overflow:hidden}
header .t{display:flex;align-items:center;gap:10px}header h1{font-family:'Chewy',system-ui;font-weight:400;color:var(--o);font-size:24px;margin:0;letter-spacing:1px;line-height:1}
header .sub{font-size:12px;opacity:.85}header .logo{height:54px;width:auto;margin-left:auto}header .logo .arco{display:none}
#tabs{display:flex;gap:6px;margin-top:8px}#tabs button{flex:1;background:transparent;color:#fff;border:0;border-bottom:3px solid transparent;padding:10px 4px;font-size:15px}#tabs button.on{border-color:var(--o);font-weight:600}
#top.solo #tabs{display:none}#top.solo{padding-bottom:10px}
.usr{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-top:4px;opacity:.9}.usr button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px}
main{padding:12px;max-width:640px;margin:0 auto 80px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}h2{font-size:18px;margin:0 0 8px}h3{font-size:15px;margin:0 0 8px}
input,select,textarea{font:inherit;padding:11px;border:1px solid var(--bd);border-radius:10px;background:#fff;width:100%}textarea{min-height:64px;margin-top:8px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:8px;flex:1;min-width:140px}label input,label select{margin-top:4px;color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.full{width:100%}.c{text-align:center;margin:10px 0}.mu{color:var(--mu);font-size:13px}
button,a.s{font:inherit;border-radius:10px;padding:11px 14px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}.b{background:var(--g);color:#fff;border:0;font-weight:600}.s{background:#fff;color:var(--g);border:1px solid var(--g)}.x{background:#fff;color:#c62828;border:1px solid #f1c0c0;padding:6px 10px}button:disabled{opacity:.5}
.sug{display:none;border:1px solid var(--bd);border-radius:10px;margin-top:4px;max-height:280px;overflow:auto;background:#fff}.sug div{padding:12px;border-bottom:1px solid #f0f0f0}.sug div.on{background:#eef6ee}
.cli{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#eef6ee;border-radius:10px;padding:10px}
.it{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0}.it .g{grid-column:1/2}.it .q{display:flex;align-items:center;gap:4px}.it .q button{width:40px;height:40px;padding:0;border:1px solid var(--bd);background:#fff;font-size:20px}.it .q input{width:64px;text-align:center;padding:8px}.it .st{text-align:right;font-weight:600}.it .x{justify-self:end}
.tot{display:flex;justify-content:space-between;font-size:18px;padding:12px 0}
.kp{display:flex;gap:8px;margin-bottom:10px}.kp div{flex:1;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px}.kp span{display:block;font-size:12px;color:var(--mu)}.kp b{font-size:20px}
#q{margin-bottom:10px}.ped{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}.ped.anulado{opacity:.55}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:#eee}.tag.pendiente{background:#fff3cd}.tag.entregado{background:#c8e6c9}.tag.anulado{background:#ffcdd2}
table{width:100%;border-collapse:collapse;margin-top:8px}td,th{padding:7px 4px;border-bottom:1px solid #f0f0f0;text-align:left;font-size:14px}.n{text-align:right}
.hist{border-left:3px solid var(--o);padding:6px 10px;margin-bottom:10px;background:#fffaf3;border-radius:0 8px 8px 0}.hist ul{margin:4px 0;padding-left:18px;font-size:14px}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:20}.dlg .card{width:100%;max-width:640px;border-radius:16px 16px 0 0;max-height:90vh;overflow:auto}
.msg{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#e8f5e9;border:1px solid #a5d6a7;padding:10px 16px;border-radius:10px;z-index:30;max-width:90%}.msg.err{background:#ffebee;border-color:#ef9a9a}
</style></head><body>

</svg></div>
